# Local development infrastructure for KiwiSlot.
# Brings up a PostgreSQL 16 database in a container.
# Usage:
#   docker compose up -d     # start in the background
#   docker compose ps        # see status
#   docker compose down      # stop and remove the container (data is kept in the volume)
#
# Compose automatically reads variables from the ".env" file in this directory.

services:
  postgres:
    image: postgres:16 # The official PostgreSQL 16 image pulled from Docker Hub
    container_name: kiwislot-postgres # Fixed, human-friendly container name
    restart: unless-stopped # Auto-restart unless we explicitly stop it
    environment:
      # On first run, Postgres creates this user/password/database automatically.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Map host port -> container port, so the app on the Mac can reach Postgres at localhost:5432.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume: keeps DB data even if the container is deleted/recreated.
      - kiwislot_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose marks the container "healthy" only once Postgres is ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kiwislot_pgdata: # The persistent storage referenced above
